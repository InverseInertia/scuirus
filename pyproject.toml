[project]
name = "pantry"
version = "0.2.0"
description = "Self-hosted grocery tracker: barcode and receipt scanning served from a home server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.4",
    "zxing-cpp>=2.2",
    "anthropic>=0.70",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.18"]
test = ["pytest>=8"]

[project.scripts]
pantry = "pantry.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pantry*"]

[tool.setuptools.package-data]
pantry = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
